<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPSS Tarih · Osmanlı Padişahları Zaman Çizelgesi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="cinema.css" />
</head>
<body>
  <div class="app">

    <!-- HUD / gamification üst barı -->
    <header class="hud">
      <div class="brand">
        <h1>Osmanlı Silsilesi</h1>
        <span>KPSS Tarih · Zaman Çizelgesi</span>
      </div>

      <div class="spacer"></div>

      <button class="music-toggle" id="music-toggle" title="Arka plan müziği aç/kapat" aria-label="Müzik">
        <span class="mt-ico">🔊</span>
      </button>

      <div class="stat">
        <div class="level-chip">
          <small>SVY</small><b id="lvl">1</b>
        </div>
      </div>

      <div class="stat xp-wrap">
        <div class="xp-top"><span id="xp-now">0 / 200 XP</span><span id="xp-total">0 XP</span></div>
        <div class="xp-bar"><div class="xp-fill" id="xp-fill"></div></div>
      </div>

      <div class="stat progress-num">
        <span><b id="prog-done">0</b> / <b id="prog-total">5</b> padişah</span>
      </div>

      <div class="stat badges" id="badges"></div>

      <button class="cinema-open" id="cinema-open" title="Sinematik zaman yolculuğu">
        <span class="co-ico">🎬</span>
        <span class="co-txt">Sinematik<br>Yolculuk</span>
      </button>
    </header>

    <!-- Ana gövde -->
    <div class="main">
      <nav class="timeline" id="timeline"></nav>
      <section class="detail" id="detail">
        <div class="empty">
          <div>
            <div class="big">Bir padişah seç</div>
            <div>Soldaki zaman çizelgesinden ilerle.</div>
          </div>
        </div>
      </section>
      <aside class="quizpanel" id="quiz"></aside>
    </div>

  </div>

  <div class="toast" id="toast"></div>

  <script src="data.js"></script>
  <script src="data_ek.js"></script>
  <script src="app.js"></script>
  <script src="cinema.js"></script>
  <script src="music.js"></script>
</body>
</html>
